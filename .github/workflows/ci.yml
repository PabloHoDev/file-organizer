name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: cada job pede só o que precisa.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Format, lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Typecheck (mypy)
        run: mypy

      - name: Testes (pytest)
        run: pytest -v

  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # necessário para a action ler os commits do PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
