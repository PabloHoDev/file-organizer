[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Organizador_Arquivo_Python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = ["Organizador_Arquivo_Python", "scripts", "tests"]
